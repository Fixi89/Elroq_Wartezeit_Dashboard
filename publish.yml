name: Dashboard automatisch aktualisieren

# Läuft täglich automatisch (Cron) und lässt sich zusätzlich jederzeit von
# Hand über den "Run workflow"-Button im Actions-Tab starten.
on:
  schedule:
    # Achtung: Cron-Zeiten in GitHub Actions sind IMMER UTC, nicht MEZ/MESZ.
    # "0 6 * * *" = 06:00 UTC = 07:00 MEZ (Winter) bzw. 08:00 MESZ (Sommer).
    # Bei Bedarf einfach die Uhrzeit hier anpassen.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

# Damit der Job im Repo committen und pushen darf.
permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests beautifulsoup4

      - name: Git-Identität für den automatischen Commit setzen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Dashboards bauen und veröffentlichen
        # Nur Elroq, bis Enyaq wieder aufgenommen wird (siehe PROJEKT_UEBERGABE.md).
        # Reaktivieren: einfach wieder auf "--vehicle both" ändern.
        #
        # ID_HASH_SALT: geheimes Salt fürs Hashen der internen Forums-ID vor
        # der Veröffentlichung (siehe hash_id() in elroq_dashboard_update.py).
        # Als Repository-Secret anlegen (Settings → Secrets and variables →
        # Actions → "New repository secret", Name ID_HASH_SALT, ein beliebiger
        # langer Zufallswert) — taucht dadurch nie im öffentlichen Repo auf.
        # Ohne gesetztes Secret greift ein fest einprogrammierter Standard-
        # Salt: besser als Klartext-IDs, aber kein Schutz gegen einen
        # gezielten Angriff.
        env:
          ID_HASH_SALT: ${{ secrets.ID_HASH_SALT }}
        run: python3 publish.py --vehicle elroq
